name: keep-warm

# Render's free tier spins the backend down after ~15 min idle, and that restart wipes the
# in-memory solve cache (so a repeat solve would cost the full ~6.5 min again). This pings the
# health endpoint every 5 min so the instance stays awake and cached solves stay instant.
# Public-repo Actions minutes are unlimited, and ~24/7 uptime (~730h) fits the 750h free quota.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -m 90 https://modern-portfolio-theory-api.onrender.com/api/health || true
