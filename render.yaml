# Render Blueprint — deploys the FastAPI backend as one free web service.
# Connect this repo in the Render dashboard (New + -> Blueprint) and it reads this file.
services:
  - type: web
    name: modern-portfolio-theory-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    # No healthCheckPath on purpose: a full solve saturates the 0.1-CPU free instance, and an
    # HTTP health check would read that as "unhealthy" and restart it mid-solve (killing the job).
    # Render still restarts the process if it actually exits.
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"      # pin so quadprog/sklearn/pyarrow resolve to prebuilt wheels
